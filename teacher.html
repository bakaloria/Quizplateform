<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#10b981" />
<meta name="robots" content="noindex, nofollow" />
<title>لوحة المعلم</title>

<link rel="manifest" href="manifest-teacher.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-teacher-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-teacher.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="لوحة المعلم" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-app="teacher">
<div id="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo" style="background:linear-gradient(135deg,#10b981,#059669)">👨‍🏫</span>
        <span class="brand-text">
          <strong>لوحة المعلم</strong>
          <small>تصحيح الإجابات</small>
        </span>
      </a>
      <div class="topbar-actions">
        <span class="badge badge-primary hidden" id="teacherBadge"></span>
        <button class="icon-btn" id="themeToggle" title="الوضع">🌙</button>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="site-footer">
    <span>لوحة المعلم</span>
    <span class="dot">•</span>
    <span>v4.0</span>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/store.js"></script>
<script src="js/groups.js"></script>
<script src="js/analytics.js"></script>
<script src="js/teacher.js"></script>
<script src="js/pwa.js"></script>
<script src="js/app-teacher.js"></script>
</body>
</html>
